[project]
name = "meteo-agent"
version = "0.1.0"
description = "Agente meteo con notifiche Telegram, storico rolling 72h e redazione messaggi via Claude"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
meteo-agent = "meteoagent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meteoagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
